name: Build

on:
  # Branches with a pull request are built by the pull_request event; building their pushes
  # too ran every commit twice.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests, debug and release APKs
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: tri-iptv-debug-apk
          path: app/build/outputs/apk/debug/*.apk
      # The one to install on a TV: R8-optimised and not debuggable. Same key, so it installs
      # over a debug build without losing the saved playlist.
      - uses: actions/upload-artifact@v4
        with:
          name: tri-iptv-release-apk
          path: app/build/outputs/apk/release/*.apk
